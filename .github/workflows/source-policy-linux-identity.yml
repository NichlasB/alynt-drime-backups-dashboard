name: Source-policy owned Linux server identity

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master commit for the empty-database identity audit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-policy-linux-identity
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Admit exact source and fresh owned directories
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -m)" == x86_64 ]]
          [[ -z "${DOCKER_HOST:-}" && -z "${DOCKER_CONTEXT:-}" ]]
          [[ "$(docker context inspect --format '{{.Endpoints.docker.Host}}')" == unix:///var/run/docker.sock ]]
          [[ ! -e "$GITHUB_WORKSPACE/.adb-linux-preflight-core" ]]
          umask 077
          mkdir -- "$RUNNER_TEMP/adb-linux-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          stage="$RUNNER_TEMP/adb-linux-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -- "$stage" "$stage/socket"

      - name: Checkout approved audit source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout pinned core for fresh source prerequisite only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: WordPress/WordPress
          ref: db96f5eaa77a8d3e8eec8923a518fa2326f0d46a
          path: .adb-linux-preflight-core
          persist-credentials: false

      - name: Exact disposable PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5.12'
          extensions: mysqli
          tools: none
          coverage: none

      - name: Fresh unchanged no-database prerequisite
        shell: bash
        run: bash scripts/ci/source-policy-linux-preflight.sh

      - name: One empty-database socket identity and release audit
        shell: bash
        run: bash scripts/ci/source-policy-linux-identity.sh

      - name: Always reconcile exact owned resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/ci/source-policy-linux-identity.sh ]]; then
            bash scripts/ci/source-policy-linux-identity.sh --cleanup
          fi
          if [[ -f scripts/ci/source-policy-linux-preflight.sh ]]; then
            bash scripts/ci/source-policy-linux-preflight.sh --cleanup
          fi
