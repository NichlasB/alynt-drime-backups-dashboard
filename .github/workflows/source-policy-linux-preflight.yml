name: Source-policy Linux preflight (no database)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-policy-linux-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Admit only the exact manually approved source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -m)" == x86_64 ]]
          [[ ! -e "$GITHUB_WORKSPACE/.adb-linux-preflight-core" ]]
          umask 077
          mkdir -- "$RUNNER_TEMP/adb-linux-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Checkout approved dashboard source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout immutable official core (never execute it)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: WordPress/WordPress
          ref: db96f5eaa77a8d3e8eec8923a518fa2326f0d46a # 7.1.4
          path: .adb-linux-preflight-core
          persist-credentials: false

      - name: Set up exact ephemeral PHP (not the workstation)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # resolved v2 commit
        with:
          php-version: '8.5.12'
          extensions: mysqli
          tools: none
          coverage: none

      - name: Run bounded environment-only preflight
        shell: bash
        run: bash scripts/ci/source-policy-linux-preflight.sh

      - name: Exact owned container and checkout cleanup
        if: always()
        shell: bash
        run: |
          if [[ -f scripts/ci/source-policy-linux-preflight.sh ]]; then
            bash scripts/ci/source-policy-linux-preflight.sh --cleanup
          fi
