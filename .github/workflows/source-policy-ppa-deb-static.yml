name: Source-policy owned PPA connection-free functional proof
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master head for ONE owned connection-free proof
        required: true
        type: string
      execution_contract:
        description: Approved ppa-connection-free-functional-v1 with fixed40/128 parent and128/128 PHP, codecs24/24; no WordPress/HTTP/SQL
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: source-policy-ppa-deb-static
  cancel-in-progress: false
jobs:
  static:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master' && github.actor == 'NichlasB'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PPA_EXECUTION_CONTRACT: ${{ inputs.execution_contract }}
    steps:
      - name: Admit exact approved head and first attempt
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$RUNNER_OS" == Linux && "$(uname -m)" == x86_64 ]]
          [[ "$PPA_EXECUTION_CONTRACT" == ppa-connection-free-functional-v1 ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Admit checked-out source closure
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          git diff --no-ext-diff --no-textconv --quiet "$EXPECTED_SHA" -- \
            .github/workflows/source-policy-ppa-deb-static.yml \
            scripts/ci/source-policy-ppa-deb-static.py \
            scripts/ci/source-policy-ppa-prefix-proof.py \
            scripts/ci/source_policy_ppa_launch.py \
            scripts/ci/source_policy_ppa_join.py scripts/ci/source_policy_ppa_storage.py scripts/ci/source_policy_ppa_prefix.py \
            scripts/ci/source_policy_deb_data.py scripts/ci/source_policy_deb_stream.py \
            scripts/ci/source_policy_deb_sources.py scripts/ci/source_policy_deb_replay.py scripts/ci/source_policy_elf_ranges.py \
            scripts/ci/source-policy-php-archive-static.py scripts/manual/source_policy_linux_minimum_static.py
      - name: Fresh prerequisites and ONE owned connection-free functional proof
        run: python3 -I -S -B scripts/ci/source-policy-ppa-prefix-proof.py --approved-connection-free-proof
      - name: Always reconcile exact owned source and runtime roots
        if: always()
        run: python3 -I -S -B scripts/ci/source-policy-ppa-prefix-proof.py --reconcile-prefix-proof
