name: Source-policy owned legacy UBI static prerequisite
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master head for one static prerequisite attempt
        required: true
        type: string
      alias_policy:
        description: Approved exact-candidate static alias exception; never an execution grant
        required: true
        default: false
        type: boolean
      elf_policy:
        description: Approved static ELF/provider inspection only; requires alias_policy and never permits execution
        required: true
        default: false
        type: boolean
      bounded_access_policy:
        description: Separately approved shared-budget bounded-string static inspection; requires alias and ELF policies
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: source-policy-legacy-ubi-feasibility
  cancel-in-progress: false
jobs:
  static:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ALIAS_POLICY: ${{ inputs.alias_policy }}
      ELF_POLICY: ${{ inputs.elf_policy }}
      BOUNDED_ACCESS_POLICY: ${{ inputs.bounded_access_policy }}
    steps:
      - name: Admit exact approved head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -m)" == x86_64 ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Admit checked-out source closure
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BOUNDED_ACCESS_POLICY" == true ]]; then
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
            git diff --no-ext-diff --no-textconv --quiet "$EXPECTED_SHA" -- \
              scripts/ci/source-policy-legacy-ubi-static.py \
              .github/workflows/source-policy-legacy-ubi-static.yml \
              scripts/manual/source-policy-linux-minimum-acquire.py \
              scripts/manual/source_policy_linux_minimum_static.py \
              scripts/manual/source_policy_ubi_provenance.py \
              scripts/manual/source_policy_ubi_alias_static.py \
              scripts/manual/source_policy_virtual_closure.py \
              scripts/manual/source_policy_ubi_elf_static.py
          fi
      - name: One static prerequisite; no candidate execution
        run: |
          case "$ALIAS_POLICY:$ELF_POLICY:$BOUNDED_ACCESS_POLICY" in
            false:false:false) python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --approved-static-prerequisite ;;
            true:false:false) python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --approved-alias-static-prerequisite ;;
            true:true:false) python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --approved-elf-static-prerequisite ;;
            true:true:true) python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --approved-bounded-elf-static-prerequisite ;;
            *) exit 1 ;;
          esac
      - name: Always reconcile exact owned artifacts
        if: always()
        run: |
          if [[ -f scripts/ci/source-policy-legacy-ubi-static.py ]]; then
            python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --cleanup
          else
            exit 1
          fi
