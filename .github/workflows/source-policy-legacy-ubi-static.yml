name: Source-policy owned legacy UBI static prerequisite
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master head for one static prerequisite attempt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: source-policy-legacy-ubi-feasibility
  cancel-in-progress: false
jobs:
  static:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Admit exact approved head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$RUNNER_OS" == Linux && "$(uname -m)" == x86_64 ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: One static prerequisite; no candidate execution
        run: python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --approved-static-prerequisite
      - name: Always reconcile exact owned artifacts
        if: always()
        run: |
          if [[ -f scripts/ci/source-policy-legacy-ubi-static.py ]]; then
            python3 -I -B scripts/ci/source-policy-legacy-ubi-static.py --cleanup
          fi
