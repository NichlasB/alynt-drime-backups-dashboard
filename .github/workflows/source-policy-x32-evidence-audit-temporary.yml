name: Temporary read-only x32 evidence feasibility audit
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master head for one bounded read-only audit
        type: string
        required: true
      enable_x32_read_only:
        description: Existing Python reads only; stop if unavailable or insufficient
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: source-policy-legacy-ubi-feasibility
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master' && github.actor == 'NichlasB' && github.run_attempt == 1 && inputs.enable_x32_read_only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ENABLE_X32_READ_ONLY: ${{ inputs.enable_x32_read_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: One bounded inline Python read-only audit
        env:
          AUDIT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, os, platform, re, signal, stat, sys, zlib
          from pathlib import Path

          ROOT=Path.cwd()
          WORKFLOW='.github/workflows/source-policy-x32-evidence-audit-temporary.yml'
          CONFIG=Path('/proc/config.gz')
          MOUNTS=Path('/proc/self/mountinfo')
          CAPS={ROOT/WORKFLOW:65536,ROOT/'.git/HEAD':64,CONFIG:65536,MOUNTS:65536}
          KEYS=('IKCONFIG','IKCONFIG_PROC','X86_X32_ABI')

          class Stop(Exception):
              pass

          def need(value, reason):
              if not value:raise Stop(reason)

          def encode(value):
              return json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode('ascii')

          class Meter:
              def __init__(self):self.used=0;self.handles=set()
              def charge(self,count):
                  need(type(count) is int and count>=0 and self.used+count<=524288,'global-byte-budget')
                  self.used+=count

          def read_file(path,meter,before=None):
              need(path in CAPS,'fixed-read-path')
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)
              meter.handles.add(fd)
              try:
                  info=os.fstat(fd);need(stat.S_ISREG(info.st_mode),'regular-input')
                  if before is not None:before(info)
                  chunks=[];total=0;cap=CAPS[path]
                  while True:
                      chunk=os.read(fd,min(4096,cap-total+1));meter.charge(len(chunk))
                      total+=len(chunk);need(total<=cap,'file-byte-budget')
                      if not chunk:break
                      chunks.append(chunk)
                  return b''.join(chunks)
              finally:
                  os.close(fd);meter.handles.remove(fd)

          def proc_origin(raw,config_info,proc_info):
              need(stat.S_ISDIR(proc_info.st_mode) and config_info.st_dev==proc_info.st_dev,'proc-device')
              covers=[]
              for line in raw.splitlines():
                  fields=line.split(b' ');need(fields.count(b'-')==1,'mount-shape')
                  split=fields.index(b'-');need(split>=6 and len(fields)>=split+4,'mount-shape')
                  mount=fields[4]
                  need(mount.startswith(b'/'),'mount-shape')
                  if mount in (b'/',b'/proc',b'/proc/config.gz'):
                      covers.append((len(mount),mount,fields[3],fields[2],fields[split+1]))
              need(bool(covers),'proc-origin')
              nearest=[row for row in covers if row[0]==max(r[0] for r in covers)]
              device=(str(os.major(proc_info.st_dev))+':'+str(os.minor(proc_info.st_dev))).encode()
              need(len(nearest)==1 and nearest[0][1:]==(b'/proc',b'/',device,b'proc'),'proc-origin')
              return 'proc-mount-correlated-not-attestation'

          def declarations(raw,meter):
              try:
                  decoder=zlib.decompressobj(31)
                  expanded=decoder.decompress(raw,262145);meter.charge(len(expanded))
                  need(len(expanded)<=262144,'expanded-byte-budget')
                  need(decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data,'complete-single-gzip')
                  expanded.decode('ascii')
              except (zlib.error,UnicodeError):raise Stop('invalid-config-encoding')
              result={}
              for key in KEYS:
                  name=('CONFIG_'+key).encode()
                  rows=[line for line in expanded.splitlines() if line.startswith(name+b'=')
                        or line.startswith(b'# '+name+b' ')]
                  need(len(rows)==1,'unique-config-declarations')
                  row=rows[0]
                  if row==b'# '+name+b' is not set':value='n'
                  else:
                      need(row in tuple(name+b'='+value for value in (b'y',b'm',b'n')),'config-declaration-shape')
                      value=row[-1:].decode()
                  need(key=='IKCONFIG' or value!='m','config-declaration-type')
                  result[key]=value
              return result,hashlib.sha256(expanded).hexdigest()

          def observe(meter):
              metadata={}
              def origin_check(info):
                  metadata['config_opened']=True
                  mount_raw=read_file(MOUNTS,meter)
                  origin=proc_origin(mount_raw,info,os.stat('/proc',follow_symlinks=False))
                  metadata.update(origin=origin,mount_bytes=len(mount_raw),
                                  mount_sha=hashlib.sha256(mount_raw).hexdigest())
              try:
                  raw=read_file(CONFIG,meter,origin_check)
              except FileNotFoundError:
                  return dict(status='unavailable',reason='proc-origin-metadata-missing' if metadata else 'config-interface-missing')
              except PermissionError:
                  return dict(status='unavailable',reason='proc-origin-metadata-inaccessible' if metadata else 'config-interface-inaccessible')
              metadata.pop('config_opened',None)
              values,expanded_sha=declarations(raw,meter)
              result=dict(status='insufficient',reason='builtin-configuration-required',declarations=values,
                          compressed_bytes=len(raw),compressed_sha=hashlib.sha256(raw).hexdigest(),
                          expanded_sha=expanded_sha,**metadata)
              if values['IKCONFIG']=='y' and values['IKCONFIG_PROC']=='y':
                  result['reason']='x32-not-compiled-out'
                  if values['X86_X32_ABI']=='n':
                      result.update(status='available',reason='channel-only-not-candidate-admission')
              return result

          def admit():
              env=os.environ
              need(platform.system()=='Linux' and platform.machine()=='x86_64'
                  and env.get('GITHUB_ACTIONS')=='true' and env.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
                  and env.get('GITHUB_REPOSITORY')=='NichlasB/alynt-drime-backups-dashboard'
                  and env.get('GITHUB_REF')=='refs/heads/master'
                  and env.get('GITHUB_WORKFLOW_REF')=='NichlasB/alynt-drime-backups-dashboard/'+WORKFLOW+'@refs/heads/master'
                  and env.get('GITHUB_ACTOR')=='NichlasB' and env.get('GITHUB_RUN_ATTEMPT')=='1'
                  and env.get('AUDIT_RUNNER_ENVIRONMENT')=='github-hosted' and env.get('ENABLE_X32_READ_ONLY')=='true'
                  and re.fullmatch('[a-f0-9]{40}',env.get('EXPECTED_SHA',''))
                  and env.get('EXPECTED_SHA')==env.get('GITHUB_SHA')
                  and re.fullmatch('[1-9][0-9]{0,19}',env.get('GITHUB_RUN_ID',''))
                  and str(ROOT)==env.get('GITHUB_WORKSPACE'),'fixed-entry')
              need(os.getuid()!=0,'unprivileged-owner')
              release=platform.release();need(re.fullmatch('[a-zA-Z0-9.+_-]{1,96}',release),'kernel-release')
              need(release=='7.0.0-1017-azure','existing-profile-changed')
              return dict(head=env['GITHUB_SHA'],run=env['GITHUB_RUN_ID'],attempt='1',kernel=release)

          def limits():
              import resource
              resource.setrlimit(resource.RLIMIT_AS,(536870912,536870912))
              resource.setrlimit(resource.RLIMIT_FSIZE,(0,0))
              signal.signal(signal.SIGALRM,lambda *_:need(False,'audit-deadline'))
              signal.alarm(10)

          def main():
              meter=Meter();armed=False
              result=dict(format='ADBX32READONLYAUDIT1',qualification=False,candidate_admission=False,
                          candidate_execution=False,sql=False,production_wiring=False,
                          filesystem_writes=False,child_processes=0)
              try:
                  result['context']=admit();limits();armed=True
                  need(read_file(ROOT/'.git/HEAD',meter)==result['context']['head'].encode()+b'\n','checkout-head')
                  raw=read_file(ROOT/WORKFLOW,meter)
                  result['context']['source']=hashlib.sha256(encode([(WORKFLOW,hashlib.sha256(raw).hexdigest())])).hexdigest()
                  result.update(observe(meter))
              except Stop as error:result.update(status='insufficient',reason=str(error))
              except FileNotFoundError:result.update(status='unavailable',reason='metadata-missing')
              except PermissionError:result.update(status='unavailable',reason='metadata-inaccessible')
              except Exception:result.update(status='insufficient',reason='audit-read-failed')
              finally:
                  if armed:signal.alarm(0)
                  for fd in tuple(meter.handles):
                      try:os.close(fd);meter.handles.remove(fd)
                      except OSError:pass
                  result['handles_closed']=not meter.handles
                  if meter.handles:result.update(status='insufficient',reason='handle-cleanup-failed')
                  result['bytes_observed']=meter.used
              wire=encode(result);need(len(wire)<=4096,'summary-budget');meter.charge(len(wire))
              print(wire.decode())
              return 0 if result['status']=='available' else 2

          if __name__=='__main__':sys.exit(main())
          PY
