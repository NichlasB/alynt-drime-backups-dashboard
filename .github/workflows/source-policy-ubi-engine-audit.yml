name: Source-policy UBI read-only engine prerequisite audit
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved master head; metadata only, never import or execution
        required: true
        type: string
      policy_preflight:
        description: Read only client/runtime/kernel prerequisite metadata; no policy or container operations
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: source-policy-legacy-ubi-feasibility
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'NichlasB/alynt-drime-backups-dashboard' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read-only engine metadata; no acquisition or fixture creation
        env:
          AUDIT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          POLICY_PREFLIGHT: ${{ inputs.policy_preflight }}
        run: |
          case "$POLICY_PREFLIGHT" in
            false) node scripts/ci/source-policy-ubi-engine-audit.mjs --approved-read-only-engine-audit ;;
            true) node scripts/ci/source-policy-ubi-engine-audit.mjs --approved-read-only-policy-preflight ;;
            *) exit 1 ;;
          esac
